<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto Pablo Goyoaga | La Gauchita</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }

    .card {
      background: white;
      width: 88%;
      max-width: 420px;
      padding: 40px 25px;
      border-radius: 20px;
      box-shadow: 0 6px 25px rgba(0,0,0,0.12);
    }

    h1 {
      margin-bottom: 5px;
      font-size: 28px;
    }

    h2 {
      margin-top: 0;
      font-size: 18px;
      font-weight: normal;
      color: #555;
    }

    .company {
      font-size: 21px;
      font-weight: bold;
      margin: 25px 0;
    }

    .button {
      display: block;
      background: #111;
      color: white;
      text-decoration: none;
      padding: 17px 20px;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      margin-top: 28px;
    }

    .help {
      margin-top: 18px;
      color: #777;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>Pablo Goyoaga</h1>

    <h2>
      Director Comercial<br>
      Commercial Director
    </h2>

    <div class="company">
      LA GAUCHITA
    </div>

    <a class="button" id="contactButton" href="#">
   Guardar contacto / Save contact
</a>

<script>
document.getElementById("contactButton").addEventListener("click", function(e) {
    e.preventDefault();

    const isIPhone = /iPhone|iPad|iPod/i.test(navigator.userAgent);

    if (isIPhone) {
        window.location.href = "Pablo_Goyoaga_PRUEBA_IPHONE_VCARD3_LOGO.vcf";
    } else {
        window.location.href = "Pablo_Goyoaga_Contacto_HD_La_Gauchita.vcf";
    }
});
</script>

    <div class="help">
      Tocá el botón para agregar el contacto a tu teléfono.<br>
      Tap the button to add the contact to your phone.
    </div>

  </div>

</body>
</html>
